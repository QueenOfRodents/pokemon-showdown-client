server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html testclient.html;

    # Fallback to PS CDN for action.php (auth)
    location = /~~showdown/action.php {
        proxy_pass https://play.pokemonshowdown.com;
        proxy_set_header Host play.pokemonshowdown.com;
        proxy_ssl_server_name on;
    }

    # Main HTML entry points - no caching
    location ~* ^/(index|preactalpha|testclient)\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Sprites & Audio (checks local first, falls back to Showdown CDN)
    location ~* ^/(sprites|audio)/ {
        try_files $uri @ps_cdn;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Static assets
    location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Showdown CDN fallback definition
    location @ps_cdn {
        proxy_pass https://play.pokemonshowdown.com;
        proxy_set_header Host play.pokemonshowdown.com;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
